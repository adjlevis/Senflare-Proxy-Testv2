name: Senflare Proxy Test

# 定时跑能力探测：拉取多源 → A×B 四格判定 → 地区补全 → 提交结果文件
on:
  schedule:
    - cron: '23 */11 * * *'    # 每 11 小时一次（UTC：00/06/12/18:23 = 北京 08/14/20/次日02:23，避开整点高峰）
  workflow_dispatch:           # 支持手动触发

permissions:
  contents: write              # 允许提交结果文件回仓库

concurrency:                    # 上一次还没跑完时不叠加新任务
  group: senflare-proxy-test
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120      # 全量约 3 万节点；A 入口 200 并发试 3 次，B 出口双接口 100 并发
    steps:
      - name: 📦 检出仓库
        uses: actions/checkout@v4

      - name: 🐍 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🔎 运行能力探测
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WECHAT_API_URL: ${{ secrets.WECHAT_API_URL }}
          WECHAT_AUTH_TOKEN: ${{ secrets.WECHAT_AUTH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python Start.py

      - name: 💾 自动提交并推送结果文件与缓存
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 数据更新 [ Senflare Proxy ]"
          file_pattern: "Senflare-Proxy*.txt Senflare-Country.json"
          skip_ci: true
